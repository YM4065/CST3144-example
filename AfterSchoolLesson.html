<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>
<body>
    <script type="module">
        const {createApp} = Vue
        const afterSchoolLesson = createApp({
            data(){
                return{
                    sitename: "Vue.js After-School Lesson",
                    product: {
                        id: 1001,
                        subject: "Computer Science",
                        location: "Location: Hendon",
                        price: 50,
                        image: "images/ComputerScience.jpg"
                    }
                }
            }
        })
        afterSchoolLesson.mount('#app')
    </script>

<div id="app">
    <h1 v-text = "sitename"></h1>

    <figure>
        <img v-bind:src="product.image" width = 300>
    </figure>
    <h2 v-text="product.subject"></h2>
    <p v-text="product.location"></p>
    <p>Price: £{{product.price}}</p>
</div>

</body>
</html>
