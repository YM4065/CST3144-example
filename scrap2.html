<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>
<body>

<!-- LAB 1 TASK 2. HELLO WORLD WITH VUE.JS:-->    
    
    <div id="mydiv">
    <h1>{{ message }}</h1>
    </div>

    <script type="module">
        const {createApp} = Vue
        const myApp = createApp({
            data() {
                return {
                    message: 'Hello World!'
                }
            }
        })
        myApp.mount('#mydiv')
    </script>

</body>
</html>
