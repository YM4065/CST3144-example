<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>After-School Lessons</title>
</head>
<body>
    
<div id="app">

    <!-- Lessons page -->
    <div v-if="showLesson">

        <h1 v-text = "sitename"></h1>
        
        <!-- Shopping Cart button: disabled when the cart is empty. -->       
    <button @click="toggleCheckout" :disabled="cart.length === 0">
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
        Shopping Cart ({{ cart.length }})
    </button>

    <!-- User input forms to allow the user to choose whether to order lessons by price, availability,
    location or subject, and whether to display them in increasing order. -->
    <div>
        <label for="sortType">Sort lessons by:</label>

        <select id="sortType" v-model="sortType">
            <option value="price">Price</option> <!-- compares lesson prices numerically. -->
            <option value="availability">Availability</option> <!-- compares available lesson spaces numerically. -->
            <option value="location">Location</option> <!-- sorts locations alphabetically. -->
            <option value="subject">Subject</option> <!-- sorts subjects alphabetically. -->
        </select>

        <br><br>

        <label for="sortOrder">Sort order:</label>

        <select id="sortOrder" v-model="sortOrder">
            <option value="ascending">Increasing order</option>
            <option value="descending">Decreasing order</option>
        </select>
    </div>
 
    <!-- Lesson information-->
    <div v-for="lesson in sortedLessons" :key="lesson.id">
            
            <figure>
                <img :src="lesson.image" width ="300" :alt="lesson.subject">
            </figure>

            <h2 v-text="lesson.subject"></h2>
            <p v-text="lesson.location"></p>
            <p>Price: £{{lesson.price}}</p>
            <p>{{lesson.availableSlot}} available.</p>

            <!-- Add to Cart button -->
            <button @click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">
                Add To Cart
            </button>
    </div>
      
    <p>Lessons in cart: {{ cart.length }}</p>
</div>

        <!-- Checkout page -->
        <div v-else>
            <h1>Checkout Page</h1>
            <button @click="toggleCheckout"> Return to store </button>

            <!-- User details -->
            <p>First Name: <input v-model="order.firstName"></p>
            <p>Last Name: <input v-model="order.lastName"></p>
            <p>Phone Number: <input v-model="order.phoneNumber"></p>
            

            <!-- Order summary-->
            <h2><br/>Order Summary</h2>
            <p>Full Name: {{fullName}}</p>
            <p>Phone Number: {{phoneNumber}}</p>

            <!-- Summary of lessons in the cart -->
            <h3>Lessons in Your Cart</h3>

            <template v-for="lesson in sortedLessons" :key="lesson.id">
                <div  v-if="cartLessonCount(lesson.id) > 0"> <!-- ensures that only lessons the cart are shown -->
            <p>
                {{ lesson.subject }} -
                Quantity: {{ cartLessonCount(lesson.id) }} <!-- displays the quantity -->
            
                <!-- Remove button -->
                <button @click="removeFromCart(lesson)">
                Remove
                </button>
            </p>
        </div>
         </template>

            <!-- Checkout button-->
            <button @click="submitOrder" :disabled="!isOrderValid">
                Checkout
            </button>
        </div>
    </div>

<script type="module">
        const {createApp} = Vue;
        const afterSchoolLesson = createApp({
            data(){
                return{
                    showLesson: true, // displays the lesson store. 
                    sitename: "Vue.js After-School Lessons",
                    lessons: [], // intialises an empty array.
                    cart: [],
                    sortType: "price", // lessons will be sorted by price by default.
                    sortOrder: "ascending", // lessons are displayed from lowest to highest.

                    // Order item object
                    order: {
                        firstName:"",
                        lastName:"",
                        phoneNumber: ""
                    }
                }
            },

            // Call the fetchData method
            created(){
                this.fetchData();
            },

            computed: {
                fullName(){
                    return this.order.firstName + " " + this.order.lastName;
                },
                phoneNumber(){
                    return this.order.phoneNumber;
                },

                // Order validation
                isOrderValid() {
                    const firstNameValid =
                    /^[A-Za-z]+$/.test(this.order.firstName.trim()); // allows only letters in the first name.

                    const lastNameValid =
                    /^[A-Za-z]+$/.test(this.order.lastName.trim()); // allows only letters in the last name.

                    const phoneValid =
                    /^[0-9]+$/.test(this.order.phoneNumber.trim()); // allows only numbers in the phone number.

                    return firstNameValid && lastNameValid && phoneValid && this.cart.length > 0;
                },

                // Return the information about the lessons
                sortedLessons(){
                    return [...this.lessons].sort((a, b) => {
                        let result = 0;

                        // Sort by price (numerically)
                        if (this.sortType === "price") {
                            result = a.price - b.price;
                        }

                        // Sort by availability (numerically)
                        else if (this.sortType === "availability") {
                            result = a.availableSlot - b.availableSlot;
                        }

                        // Sort by location (alphabetically)
                        else if (this.sortType === "location") {
                            result = a.location.localeCompare(b.location);
                        }

                        // Sort by subject (alphabetically)
                        else if (this.sortType === "subject") {
                            result = a.subject.localeCompare(b.subject);
                        }

                        // Increasing or decreasing order
                        return this.sortOrder === "ascending" ? result : -result;
                    }); 
                }
            },

                methods:{
                    // Add a lesson ID to the cart and reduce availability
                    addToCart(lesson){  
                        if (lesson.availableSlot > 0) {
                        this.cart.push(lesson.id); // Pushes a copy of the lesson ID to the cart.            
                        lesson.availableSlot--;
                        }
                    },

                    // Get lesson data from http://localhost:3000/lessons
                    async fetchData(){
                        const url = "http://localhost:3000/lessons";
                        let response = await (fetch (url));
                        this.lessons = await response.json();
                    },

                    // Complete order
                    async submitOrder() {
                        if (!this.isOrderValid) return;
                        
                        // Send the order to the backend
                        const success = await this.postOrder();

                        // Reset application after successful checkout
                        if (success) {
                            alert("Your order has been confirmed!");
                        
                        
                        this.cart = []; // clears all items from the cart.
                        this.order.firstName = "";
                        this.order.lastName = "";
                        this.order.phoneNumber = "";
                        this.showLesson = true;
                        }
                    },

                    toggleCheckout() {
                        this.showLesson = !this.showLesson; // Toggle the value of display cart.
                    },

                    // Count lessons
                    cartLessonCount(id) {
                        return this.cart.filter(item => item === id).length;
                    },

                    // Check availiblity
                    canAddToCart(lesson) {
                    return lesson.availableSlot > 0;
                    },

                    // Remove one copy of a lesson from the cart
                    removeFromCart(lesson) {
                        const index = this.cart.indexOf(lesson.id); // finds the lesson in the cart.

                        if (index !== -1) {
                            this.cart.splice(index, 1); // removes one copy.
                            lesson.availableSlot++; // restores availability.
                        }
                    },

                    // Transfer order information to the backend server
                    async postOrder(){
                        try {
                            const url = "http://localhost:3000/orders";
                        
                            // Create the order data, including the selected lesson IDs
                            const orderData = {
                                firstName: this.order.firstName,
                                lastName: this.order.lastName,
                                phoneNumber: this.order.phoneNumber,
                                lessonIDs: this.cart
                            }

                            const options = {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(orderData)
                        }

                        const response = await fetch (url, options);

                        if (!response.ok) {
                            throw new Error("Failed to submit order");
                        }

                        const result = await response.json();
                        console.log(result.message);

                        return true;

                    } catch (error) {
                        console.error("Error submitting order:", error);
                        alert("Unable to submit your order. Please try again.");
                        return false;
                    }
                }
            }
        });
        afterSchoolLesson.mount('#app');
</script>

</body>
</html>
