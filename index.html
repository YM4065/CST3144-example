<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="lessons.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>After-School Lessons</title>
</head>
<body>
    
<div id="app">
    <div v-if="showLesson">
        <h1 v-text = "sitename"></h1>
        
        <!-- Checkout button displays the number of lessons in the cart. -->       
    <button @click="toggleCheckout">
        <i class="fa fa-shopping-cart" aria-hidden="true"></i> 
         Checkout ({{ cart.length }})
    </button>
 
    <!-- Lesson information-->
    <div v-for="lesson in lessons" :key="lesson.id">
            
            <figure>
                <img :src="lesson.image" width ="300" :alt="lesson.subject">
            </figure>

            <h2 v-text="lesson.subject"></h2>
            <p v-text="lesson.location"></p>
            <p>Price: £{{lesson.price}}</p>
            <p>{{lesson.availableSlot}} available.</p>

            <!-- Add to Cart button -->
            <button @click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">
                Add To Cart
            </button>
     
    </div>
    </div>  

        <div v-else>
            <h1>Checkout Page</h1>

            <p>Lessons in cart: {{ cart.length }}</p>

            <button @click="toggleCheckout"> Return to store </button>
        </div>
</div>

<script type="module">
        const {createApp} = Vue;
        const afterSchoolLesson = createApp({
            data(){
                return{
                    showLesson: true, 
                    sitename: "Vue.js After-School Lessons",
                    lessons: lessonsArray,
                    cart: [],
                    firstName:"",
                    lastName:"",
                    phoneNumber: ""
                };
            },

                methods:{

                    // Add a lesson ID to the cart and reduce availability
                    addToCart(lesson){  
                        if (this.canAddToCart(lesson)) {
                            this.cart.push(lesson.id); // Pushes a copy of the lesson ID to the cart.
                            lesson.availableSlot--;
                    }
                    },

                    //showCheckout(){
                        //this.showProduct = this.showProduct ? false : true;
                    //},

                    toggleCheckout() {
                        this.showLesson = !this.showLesson; // Toggle the value of display cart.
                    },

                    // Count lessons
                    cartLessonCount(id) {
                        return this.cart.filter(item => item === id).length;
                    },

                    // Check availiblity
                    canAddToCart(lesson) {
                    return lesson.availableSlot > 0;
                    }
                }
            });
        afterSchoolLesson.mount('#app');
</script>

</body>
</html>
