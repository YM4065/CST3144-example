<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>
<body>
    <div id="div1"></div>

<div id="app">

    <!-- Add items to cart. -->
    <button v-on:click="addToCart()" :disabled="!canAddToCart">Add to cart</button>    
    
    <!-- Checkout button displays the number of items in the cart. -->       
    <button @click="toggleCart" :disabled="cart.length === 0"> 
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>Checkout ({{cartItemCount}})
    </button>

    <div v-if='!displayCart'> <!-- When displayCart is false, the lesson information is displayed. -->
        <!-- Lesson page. -->
        <h1 v-text = "sitename"></h1>

        <figure>
            <img v-bind:src="product.image" width = 300>
        </figure>

        <h2 v-text="product.subject"></h2>
        <p v-text="product.location"></p>
        
        <!-- Price of product. -->
        <p>Price: £{{product.price}}</p>
        <!-- Number of items added to the cart. -->
        <p>Items: {{ numberOfItems}}</p>
        <!-- How many spaces are left. -->
        <p>Spaces: {{ product.availableSlot }}</p>
    </div>
    
    <div v-else>
        <!-- Shopping cart page. -->
        <h2>Shopping Cart</h2> <!-- When displayCart is true, "Shopping cart" appears instead. -->
        <p>Items in cart: {{ cartItemCount }}</p> <!-- Displays number of items in the cart. -->
    </div>

<script type="module">
        const {createApp} = Vue
        const afterSchoolLesson = createApp({
            data(){
                return{
                    showProduct:true, 
                    sitename: "Vue.js After-School Lesson",
                    product: { // Product is the lesson.
                        id: 1001, // Lesson ID.
                        subject: "Computer Science",
                        location: "Location: Hendon",
                        price: 50,
                        image: "images/ComputerScience.jpg",
                        availableSlot: 5 // This availability field tracks available slots for purchase.
                    },
                    cart:[], // Stores lesson ID to the basket.
                    displayCart: false
                }
            },
                methods:{
                    addToCart(){  
                        this.cart.push(this.product.id); // Pushes a copy of the lesson ID to the cart.
                        this.decreaseSlot(); // Available slots decrease by 1.
                    },
                    decreaseSlot() {
                        this.product.availableSlot = this.product.availableSlot - 1; // Reduces lesson availability by 1.
                    },
                    showCheckout(){
                        this.showProduct = this.showProduct ? false : true;
                    },
                    toggleCart() {
                        this.displayCart = !this.displayCart // Toggle the value of display cart.
                    }
                },
                computed:{
                    cartItemCount:function() {
                        return this.cart.length;
                    },
                    // Add number of items to the cart.
                    canAddToCart:function() {
                        return this.product.availableSlot > 0;
                    },
                    // Receives added items to the cart.
                    numberOfItems:function() {
                        return this.cart.length;
                    }         
                }
            })
        afterSchoolLesson.mount('#app')
</script>
</body>
</html>
